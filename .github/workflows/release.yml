name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller>=6,<7"

      - name: Check tag matches version.py
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = python -c "from version import VERSION; print(VERSION)"
          if ($env:TAG -ne "v$v") { Write-Error "Tag $env:TAG != version.py v$v"; exit 1 }

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build executable
        run: pyinstaller --noconfirm AccountManager.spec

      - name: SHA-256 checksum
        id: sha
        run: |
          $h = (Get-FileHash dist/AccountManager.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$h  AccountManager.exe`n")
          "hash=$h" >> $env:GITHUB_OUTPUT

      # ── Rolling "latest" release (every master push) ──────────────────
      - name: Delete existing latest release
        if: github.ref_type == 'branch'
        run: gh release delete latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create latest release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: |
            dist/AccountManager.exe
            dist/SHA256SUMS.txt
          body: |
            ## Latest build

            Auto-released from commit ${{ github.sha }}

            > **${{ github.event.head_commit.message }}**

            ### Installation
            1. Download `AccountManager.exe` below
            2. Run it — no Python install required
            3. Open the Riot Client to the sign-in screen before clicking **Login**

            > Windows Defender may warn on first run — click **More info → Run anyway**.

            SHA-256 (`AccountManager.exe`): `${{ steps.sha.outputs.hash }}`

      # ── Versioned release (on v*.*.* tag) ────────────────────────────
      - name: Upload exe to versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AccountManager.exe
            dist/SHA256SUMS.txt
