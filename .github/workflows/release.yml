name: Build & Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --icon=icon.ico `
            --name=AccountManager `
            --add-data "icon.ico;." `
            main.py

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: dist/AccountManager.exe
          body: |
            ## Latest build

            Auto-released from commit ${{ github.sha }}

            > **${{ github.event.head_commit.message }}**

            ### Installation
            1. Download `AccountManager.exe` below
            2. Run it — no Python install required
            3. Open the Riot Client to the sign-in screen before clicking **Login**

            > Windows Defender may warn on first run — click **More info → Run anyway**.
